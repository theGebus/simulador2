<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Créditos</title>
  <link rel="stylesheet" href="simulador_completo.css">
</head>
<body>

  <header>
    <h1>Sistema Básico de Créditos</h1>
  </header>

  <nav>
    <button onclick="mostrarSeccion('parametros')">
      Parámetros
    </button>
    <button onclick="mostrarSeccion('clientes')">
      Clientes
    </button>
  </nav>

  <section class="activa" id="parametros">
    <h2>Configurar Parámetros</h2>

    <label for="tasaInteres">Tasa de interés:</label>
    <input
      type="number"
      id="tasaInteres"
      min="10"
      max="20"
      value="15"
    >
    <span>%</span>

    <br>

    <button onclick="guardarTasa()">Guardar tasa</button>

    <p id="mensajeTasa"></p>
  </section>

  <section id="clientes">
    <h2>Registro de Clientes</h2>

    <input
      type="text"
      id="cedula"
      placeholder="Cédula: 1712345678"
    >

    <input
      type="text"
      id="nombre"
      placeholder="Nombre: Juan"
    >

    <input
      type="text"
      id="apellido"
      placeholder="Apellido: Pérez"
    >

    <input
      type="number"
      id="ingresos"
      placeholder="Ingresos: 1200"
    >

    <input
      type="number"
      id="egresos"
      placeholder="Egresos: 500"
    >

    <br>

    <button onclick="guardarCliente()">Guardar cliente</button>
    <button>Limpiar</button>

    <table>
      <thead>
        <tr>
          <th>Cédula</th>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>Ingresos</th>
          <th>Egresos</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaClientes"></tbody>
    </table>
  </section>

  <script src="utilitarios.js"></script>
  <script src="simulador_completo.js"></script>

</body>
</html>
