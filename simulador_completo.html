<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Créditos</title>
  <link rel="stylesheet" href="simulador_completo.css">
</head>
<body>

  <header>
    <h1>Sistema Básico de Créditos</h1>
  </header>

  <nav>
    <button onclick="mostrarSeccion('parametros')">
      Parámetros
    </button>
    <button onclick="mostrarSeccion('clientes')">
      Clientes
    </button>
    <button onclick="mostrarSeccion('creditos')">Créditos</button>
    <button onclick="mostrarSeccion('listaCreditos')">Créditos Registrados</button>
  </nav>

  <section class="activa" id="parametros">
    <h2>Configurar Parámetros</h2>

    <label for="tasaInteres">Tasa de interés:</label>
    <input
      type="number"
      id="tasaInteres"
      min="10"
      max="20"
      value="15"
    >
    <span>%</span>

    <br>

    <button onclick="guardarTasa()">Guardar tasa</button>

    <p id="mensajeTasa"></p>
  </section>

  <section id="clientes">
    <h2>Registro de Clientes</h2>

    <input
      type="text"
      id="cedula"
      placeholder="Cédula: 1712345678"
    >

    <input
      type="text"
      id="nombre"
      placeholder="Nombre: Juan"
    >

    <input
      type="text"
      id="apellido"
      placeholder="Apellido: Pérez"
    >

    <input
      type="number"
      id="ingresos"
      placeholder="Ingresos: 1200"
    >

    <input
      type="number"
      id="egresos"
      placeholder="Egresos: 500"
    >

    <br>

    <button onclick="guardarCliente()">Guardar cliente</button>
    <button onclick="limpiar()">Limpiar</button>

    <table>
      <thead>
        <tr>
          <th>Cédula</th>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>Ingresos</th>
          <th>Egresos</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaClientes"></tbody>
    </table>
  </section>

<section id="creditos">
  <h2>Solicitar Crédito</h2>

  <label for="buscarCedulaCredito">Cédula del cliente:</label>
  <input type="text" id="buscarCedulaCredito" oninput="limpiarBusquedaCredito()">
  <button onclick="buscarClienteCredito()">Buscar cliente</button>

  <div id="datosClienteCredito" class="card"></div>

  <label for="montoCredito">Monto del crédito ($):</label>
  <input type="number" id="montoCredito" min="0.01" step="0.01" oninput="limpiarResultadoCredito()">
  <label for="plazoCredito">Plazo (meses):</label>
  <input type="number" id="plazoCredito" min="1" step="1" oninput="limpiarResultadoCredito()">

  <br>

  <button onclick="calcularCredito()">Calcular crédito</button>

  <div id="resultadoCredito" aria-live="polite"></div>

  <button id="btnAsignarCredito" onclick="asignarCredito()" disabled>
    Asignar Crédito
  </button>
</section>


<section id="listaCreditos">
  <h2>Créditos Registrados</h2>

  <label for="buscarCedulaListado">Cédula del cliente:</label>
  <input type="text" id="buscarCedulaListado">
  <button onclick="buscarCreditosCliente()">Buscar</button>
  <button onclick="mostrarTextoEnCaja('buscarCedulaListado', ''); pintarCreditos(creditos)">Ver todos</button>

  <p id="mensajeHistorial" aria-live="polite"></p>
  <div class="tabla-contenedor">
  <table>
    <thead>
      <tr>
        <th>Cédula</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Monto</th>
        <th>Tasa</th>
        <th>Plazo</th>
        <th>Cuota</th>
      </tr>
    </thead>
    <tbody id="tablaCreditos"></tbody>
  </table>
  </div>
</section>

  <script src="utilitarios.js"></script>
  <script src="simulador_completo.js"></script>

</body>
</html>
